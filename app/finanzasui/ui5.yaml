specVersion: "3.1"
metadata:
  name: sabnez.com.finanzasui
type: application
framework:
  name: SAPUI5
  version: "1.150.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ui.unified
    - name: sap.f
    - name: sap.uxap
builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateComponentPreload
      configuration:
        archiveName: sabnezcomfinanzasui
        relativePaths: true
