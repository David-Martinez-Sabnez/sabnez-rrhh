<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de configuración</title>
  <style>
    html,
    body,
    body > div,
    #container,
    #container-uiarea {
      height: 100%;
    }
  </style>
  <script id="sap-ui-bootstrap" src="https://sapui5.hana.ondemand.com/1.150.0/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"sabnez.com.configuracionui":"./"}'
    data-sap-ui-compatversion="edge"
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-async="true"
    data-sap-ui-frameoptions="trusted"></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div data-sap-ui-component data-name="sabnez.com.configuracionui" data-id="container"
    data-settings='{"id":"sabnez.com.configuracionui"}' data-handle-validation="true"></div>
</body>
</html>
